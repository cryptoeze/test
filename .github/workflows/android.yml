name: Build Android app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CryptoEze-test-build-${VERSION_CODE}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/CryptoEze-build-${VERSION_CODE}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoEze-build-${{ github.run_number }}
          path: dist/*

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: CryptoEze test build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            Test APK for CryptoEze (build ${{ github.run_number }}).
            Download the .apk below on your Android phone and install it.
