name: Build Android app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          find app/build/outputs -name "*.apk" -o -name "*.aab"
          for brand in cryptoeze:CryptoEze tiktokpk:TikTokpk; do
            flavor=${brand%%:*}; name=${brand##*:}
            cp "$(find app/build/outputs/apk -path "*${flavor}*" -name "*.apk" | head -1)" "dist/${name}-build-${VERSION_CODE}.apk"
            cp "$(find app/build/outputs/bundle -path "*${flavor}*" -name "*.aab" | head -1)" "dist/${name}-build-${VERSION_CODE}.aab"
          done
          mkdir -p tools
          cp "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/lib/apksigner.jar" tools/
          cp app/build/outputs/bundle/release/app-release.aab "dist/CryptoEze-build-${VERSION_CODE}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoEze-build-${{ github.run_number }}
          path: dist/*

      - name: Publish signing tool (used to sign the public APK with the private release key)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signing-tools
          name: Signing tools (internal)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: tools/apksigner.jar

      - name: Publish build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Apps build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            CryptoEze and TikTokpk Android apps (build ${{ github.run_number }}).
            Download the .apk below on your Android phone and install it.
